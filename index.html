<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="calculator">

    <!-- ── Display ── -->
    <div class="display">
      <input type="text" id="screen" value="0" readonly />
    </div>

    <!-- ── Buttons ── -->
    <div class="buttons">

      <!-- Row 1: Clear, Delete, %, ÷ -->
      <button class="btn btn-util" onclick="clearScreen()">C</button>
      <button class="btn btn-util" onclick="deleteLast()">⌫</button>
      <button class="btn btn-op"   onclick="appendToScreen('%')">%</button>
      <button class="btn btn-op"   onclick="appendToScreen('/')">÷</button>

      <!-- Row 2: 7 8 9 × -->
      <button class="btn btn-num"  onclick="appendToScreen('7')">7</button>
      <button class="btn btn-num"  onclick="appendToScreen('8')">8</button>
      <button class="btn btn-num"  onclick="appendToScreen('9')">9</button>
      <button class="btn btn-op"   onclick="appendToScreen('*')">×</button>

      <!-- Row 3: 4 5 6 − -->
      <button class="btn btn-num"  onclick="appendToScreen('4')">4</button>
      <button class="btn btn-num"  onclick="appendToScreen('5')">5</button>
      <button class="btn btn-num"  onclick="appendToScreen('6')">6</button>
      <button class="btn btn-op"   onclick="appendToScreen('-')">−</button>

      <!-- Row 4: 1 2 3 + -->
      <button class="btn btn-num"  onclick="appendToScreen('1')">1</button>
      <button class="btn btn-num"  onclick="appendToScreen('2')">2</button>
      <button class="btn btn-num"  onclick="appendToScreen('3')">3</button>
      <button class="btn btn-op"   onclick="appendToScreen('+')">+</button>

      <!-- Row 5: 0 . = -->
      <button class="btn btn-zero" onclick="appendToScreen('0')">0</button>
      <button class="btn btn-num"  onclick="appendToScreen('.')">.</button>
      <button class="btn btn-eq"   onclick="calculate()">=</button>

    </div>
  </div>

  <!-- <script>

        var result = eval(screen.value);

</body>
</html>
